kind = "web"
previewPath = "/"
title = "TGMSIDC Procurement Portal"
version = "1.0.0"
id = "artifacts/procurement-ui"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22899

[services.development]
run = "pnpm --filter @workspace/procurement-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/procurement-ui", "run", "build" ]
publicDir = "artifacts/procurement-ui/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22899"
BASE_PATH = "/"
